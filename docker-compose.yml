services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-panelada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panelada}
      POSTGRES_DB: ${POSTGRES_DB:-panelada_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - panelada_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-panelada} -d ${POSTGRES_DB:-panelada_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: UTC
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-panelada}:${POSTGRES_PASSWORD:-panelada}@postgres:5432/${POSTGRES_DB:-panelada_dev}
      JWT_SECRET: ${JWT_SECRET:-panelada-dev-only-jwt-secret-change-in-prod-0001}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=}
      FIELD_ENCRYPTION_KEY_VERSION: ${FIELD_ENCRYPTION_KEY_VERSION:-1}
      CURATOR_EMAIL: ${CURATOR_EMAIL:-curador@panelada.local}
      CURATOR_PASSWORD: ${CURATOR_PASSWORD:-panelada-curador-dev}
      PHOTO_STORAGE_DIR: /data/photos
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - panelada_photos:/data/photos
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/v1/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  panelada_pgdata:
  panelada_photos:
