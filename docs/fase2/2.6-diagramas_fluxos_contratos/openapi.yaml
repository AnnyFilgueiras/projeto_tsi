        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: lembretes.definir
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaLembretes'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    Operacao:
      oneOf:
      - $ref: '#/components/schemas/OpAvaliacao'
      - $ref: '#/components/schemas/OpReagendar'
      - $ref: '#/components/schemas/OpRemoverItem'
      - $ref: '#/components/schemas/OpDataCompra'
      - $ref: '#/components/schemas/OpMarcarItem'
      - $ref: '#/components/schemas/OpCadastrarRestricao'
      - $ref: '#/components/schemas/OpRevogarRestricao'
      - $ref: '#/components/schemas/OpLembretes'
      discriminator:
        propertyName: tipo
        mapping:
          avaliacao.registrar: '#/components/schemas/OpAvaliacao'
          item.reagendar: '#/components/schemas/OpReagendar'
          item.remover: '#/components/schemas/OpRemoverItem'
          lista.definir_data_compra: '#/components/schemas/OpDataCompra'
          lista.marcar_item: '#/components/schemas/OpMarcarItem'
          restricao.cadastrar: '#/components/schemas/OpCadastrarRestricao'
          restricao.revogar: '#/components/schemas/OpRevogarRestricao'
          lembretes.definir: '#/components/schemas/OpLembretes'
      description: 'Operação da fila do app. O opId é gerado no cliente (UUID v7) e é a chave de idempotência. Na
        avaliacao.registrar, o opId é também o id da Avaliacao. Validade do registro de idempotência: 90 dias.'
    Desbloqueios:
      type: object
      properties:
        evolucoes:
          type: array
          items:
            type: string
            format: uuid
        conquistas:
          type: array
          items:
            type: string
            format: uuid
      description: Confirmação do servidor. Só acrescenta; nunca revoga (RN04).
      additionalProperties: false
    ResultadoOperacao:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - confirmada
          - rejeitada
