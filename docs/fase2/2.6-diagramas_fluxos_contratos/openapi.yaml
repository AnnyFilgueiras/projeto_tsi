        ativo:
          type: boolean
        tipos:
          type: array
          items:
            type: string
            enum:
            - compra
            - preparo
        frequencia:
          type: string
          description: Valores a definir na implementação do app; RNF07 limita a 2 notificações por dia.
      required:
      - ativo
      - tipos
      additionalProperties: false
    OpAvaliacao:
      type: object
