components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acesso de 45 minutos com contaId e papel (`usuario` ou `curador`).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'UUID gerado no cliente (v7 no app). Mesma chave e mesmo conteúdo devolvem a resposta gravada,
        sem reaplicar. Mesma chave com conteúdo diferente: 422. Validade de 90 dias. Em criação de recurso, é igual
        ao `id` enviado no corpo.'
    PacoteVersao:
      name: X-Pacote-Alergenos-Versao
      in: header
      required: false
      schema:
        type: string
      description: Versão do pacote de alérgenos em uso no app. A resposta traz pacoteVersaoMinima; o app avisa,
        mas não bloqueia.
    PratoId:
      name: pratoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SugestaoId:
      name: sugestaoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanoId:
      name: planoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropostaId:
      name: propostaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Invalida:
      description: Requisição inválida (tipo `validacao`). Lista os campos em `erros`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NaoAutenticado:
      description: Token ausente, inválido ou expirado (tipo `nao-autenticado`). O app tenta renovar com o refresh
        token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    CredenciaisInvalidas:
      description: E-mail ou senha incorretos (tipo `credenciais-invalidas`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    RefreshInvalido:
      description: Refresh token inválido, expirado ou revogado, ou reuso fora da janela de 60 s (tipo `refresh-invalido`).
        A família de tokens é revogada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ProibidoPapel:
      description: Rota exige papel curador (tipo `proibido-papel`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NaoEncontrado:
      description: Recurso inexistente, desativado ou de outra conta (tipo `nao-encontrado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    EmAndamento:
      description: Requisição com a mesma Idempotency-Key ainda em processamento (tipo `em-andamento`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    ChaveReutilizada:
      description: A Idempotency-Key já foi usada com conteúdo diferente (tipo `chave-reutilizada`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    RegraDeNegocio:
      description: Regra de negócio violada (tipo `regra-de-negocio`). Em rotas com Idempotency-Key, 422 também
        indica chave reutilizada com conteúdo diferente (tipo `chave-reutilizada`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    EmailEmUso:
      description: E-mail já vinculado a outra conta (tipo `email-em-uso`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    LoteGrande:
      description: Mais de 100 operações no lote (tipo `lote-grande`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    LimiteExcedido:
      description: Limite de tentativas ou de criação de contas excedido (tipo `limite-excedido`).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até nova tentativa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
  schemas:
    CodigoAlergeno:
      type: string
      enum:
      - trigo_centeio_cevada_aveia
      - crustaceos
      - ovo
      - peixe
      - amendoim
      - soja
      - leite
      - amendoa
      - avela
      - castanha_caju
      - castanha_brasil
      - macadamia
      - noz
      - peca
      - pistache
      - pinoli
      - castanha_castanea
      - latex
      - lactose
      description: 'Vocabulário controlado v1: os 18 alimentos da lista da ANVISA (RDC 26/2015, consolidada pela
        RDC 727/2022; conferir a lista vigente) mais `lactose`, adicionado pela dupla. O item 1 da RDC agrupa trigo,
        centeio, cevada e aveia em um único código.'
    EstadoAlergenos:
      type: string
      enum:
      - verificado
      - declarado_fonte
      - nao_verificado
      description: Lista vazia de alérgenos é `nao_verificado`, salvo confirmação explícita do curador (`confirmadoSemAlergenos`)
        ao verificar (RN08).
    Continente:
      type: string
      enum:
      - america
      - africa
      - europa
      - asia
      - oceania
    EstadoPublicacao:
      type: string
      enum:
      - proposto
      - aprovado
      - desativado
      description: Só `aprovado` chega ao usuário (RN21). Prato aprovado nunca é apagado, só desativado.
    LicencaFoto:
      type: string
      enum:
      - dominio_publico
      - cc0
      - cc_by
      - cc_by_sa
      - autoria_propria
      description: Licenças NC, ND e proprietárias são recusadas (ADR-012). Lista a reconfirmar junto com o R10.
    Dificuldade:
      type: string
      enum:
      - facil
      - media
      - dificil
    Problema:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: Tipo do problema, por exemplo `validacao`, `regra-de-negocio`, `chave-reutilizada`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        erros:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string
            required:
            - campo
            - mensagem
            additionalProperties: false
        fluxoManualDisponivel:
          type: boolean
      required:
      - type
      - title
      - status
      description: Formato RFC 9457 (application/problem+json). Nunca contém restrição alimentar, alérgeno do perfil
        nem dado pessoal (A13, A05).
      additionalProperties: true
    ProblemaPortao:
      allOf:
      - $ref: '#/components/schemas/Problema'
      - type: object
        properties:
          violacoes:
            type: array
            items:
              type: object
              properties:
                codigo:
                  type: string
                  enum:
                  - campo_faltante
                  - fonte_ausente
                  - foto_sem_atribuicao
                  - estado_alergenos_ausente
                  - invariante_verificado_sem_alergenos
                  - invariante_uniao_alergenos
                  - invariante_substituto_verificado_sem_alergenos
                  - invariante_leite_sem_lactose
                campo:
                  type: string
                mensagem:
                  type: string
              required:
              - codigo
              - mensagem
              additionalProperties: false
    ParTokens:
      type: object
      properties:
        tokenAcesso:
          type: string
          description: JWT de 45 minutos. Carrega só contaId e papel.
        expiraEm:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Opaco, de uso único, rotativo, validade de 30 dias.
        refreshExpiraEm:
          type: string
          format: date-time
      required:
      - tokenAcesso
      - expiraEm
      - refreshToken
      - refreshExpiraEm
      additionalProperties: false
    CargaAvaliacao:
      type: object
      properties:
        pratoId:
          type: string
          format: uuid
        nota:
          type: integer
          minimum: 0
          maximum: 10
          description: 'Meios-pontos: 0 a 10 representa 0 a 5 em passos de 0,5 (RN05).'
        relato:
          type: string
          maxLength: 2000
        alteracoes:
          type: string
          maxLength: 2000
        itemId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Item de rotina concluído por esta avaliação (UC10 FA2).
      required:
      - pratoId
      - nota
      additionalProperties: false
    CargaReagendar:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        novaData:
          type: string
          format: date
      required:
      - itemId
      - novaData
      additionalProperties: false
    CargaRemoverItem:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
      required:
      - itemId
      additionalProperties: false
    CargaDataCompra:
      type: object
      properties:
        planoId:
          type: string
          format: uuid
        dataCompra:
          type: string
          format: date
      required:
      - planoId
      - dataCompra
      additionalProperties: false
    CargaMarcarItem:
      type: object
      properties:
        planoId:
          type: string
          format: uuid
        ingredienteId:
          type: string
          format: uuid
        comprado:
          type: boolean
      required:
      - planoId
      - ingredienteId
      - comprado
      additionalProperties: false
    CargaCadastrarRestricao:
      type: object
