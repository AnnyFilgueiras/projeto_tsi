          format: uuid
        tipo:
          type: string
          const: avaliacao.registrar
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaAvaliacao'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpReagendar:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: item.reagendar
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaReagendar'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpRemoverItem:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: item.remover
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaRemoverItem'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpDataCompra:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: lista.definir_data_compra
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaDataCompra'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpMarcarItem:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: lista.marcar_item
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaMarcarItem'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpCadastrarRestricao:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: restricao.cadastrar
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaCadastrarRestricao'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpRevogarRestricao:
      type: object
      properties:
        opId:
          type: string
          format: uuid
        tipo:
          type: string
          const: restricao.revogar
        criadaEm:
          type: string
          format: date-time
        carga:
          $ref: '#/components/schemas/CargaRevogarRestricao'
      required:
      - opId
      - tipo
      - criadaEm
      - carga
      additionalProperties: false
    OpLembretes:
      type: object
