          type: string
          format: date
        status:
          type: string
          enum:
          - planejado
          - concluido
          description: '`em preparo` existe só no aparelho e não sincroniza.'
      required:
      - id
      - pratoId
      - dataPreparo
      - status
      additionalProperties: false
