        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de acesso de 45 minutos com accountId e papel (`user` ou `curator`).
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'UUID gerado no cliente (v7 no app). Mesma chave e mesmo conteúdo devolvem a resposta gravada,
        sem reaplicar. Mesma chave com conteúdo diferente: 422. Validade de 90 dias. Em criação de recurso, é igual
        ao `id` enviado no corpo.'
    PackageVersion:
      name: X-Allergen-Package-Version
      in: header
      required: false
      schema:
        type: string
      description: Versão do pacote de alérgenos em uso no app. A resposta traz minPackageVersion; o app avisa,
        mas não bloqueia.
    DishId:
      name: dishId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Requisição inválida (tipo `validation`). Lista os campos em `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Token ausente, inválido ou expirado (tipo `unauthenticated`). O app tenta renovar com o refresh
        token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: E-mail ou senha incorretos (tipo `invalid-credentials`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRefresh:
      description: Refresh token inválido, expirado ou revogado, ou reuso fora da janela de 60 s (tipo `invalid-refresh`).
        A família de tokens é revogada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenRole:
      description: Rota exige papel curador (tipo `forbidden-role`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente, desativado ou de outra conta (tipo `not-found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InProgress:
      description: Requisição com a mesma Idempotency-Key ainda em processamento (tipo `in-progress`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    KeyReused:
      description: A Idempotency-Key já foi usada com conteúdo diferente (tipo `key-reused`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRule:
      description: Regra de negócio violada (tipo `business-rule`). Em rotas com Idempotency-Key, 422 também indica
        chave reutilizada com conteúdo diferente (tipo `key-reused`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EmailInUse:
      description: E-mail já vinculado a outra conta (tipo `email-in-use`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BatchTooLarge:
      description: Mais de 100 operações no lote (tipo `batch-too-large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimitExceeded:
      description: Limite de tentativas ou de criação de contas excedido (tipo `rate-limit-exceeded`).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos até nova tentativa.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AllergenCode:
      type: string
      enum:
      - trigo_centeio_cevada_aveia
      - crustaceos
      - ovo
      - peixe
      - amendoim
      - soja
      - leite
      - amendoa
      - avela
      - castanha_caju
      - castanha_brasil
      - macadamia
      - noz
      - peca
      - pistache
      - pinoli
      - castanha_castanea
      - latex
      - lactose
      description: 'Vocabulário controlado v1: os 18 alimentos da lista da ANVISA (RDC 26/2015, consolidada pela
        RDC 727/2022; conferir a lista vigente) mais `lactose`, adicionado pela dupla. O item 1 da RDC agrupa trigo,
        centeio, cevada e aveia em um único código.'
    AllergenState:
      type: string
      enum:
      - verified
      - source_declared
      - unverified
      description: Lista vazia de alérgenos é `unverified`, salvo confirmação explícita do curador (`confirmedAllergenFree`)
        ao verificar (RN08).
    Continent:
      type: string
      enum:
      - america
      - africa
      - europe
      - asia
      - oceania
    PublicationState:
      type: string
      enum:
      - proposed
      - approved
      - deactivated
      description: Só `approved` chega ao usuário (RN21). Prato aprovado nunca é apagado, só desativado.
    PhotoLicense:
      type: string
      enum:
      - public_domain
      - cc0
      - cc_by
      - cc_by_sa
      - own_work
      description: Licenças NC, ND e proprietárias são recusadas (ADR-012). Lista a reconfirmar junto com o R10.
    Difficulty:
      type: string
      enum:
      - easy
      - medium
      - hard
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: Tipo do problema, por exemplo `validation`, `business-rule`, `key-reused`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
            additionalProperties: false
        manualFlowAvailable:
          type: boolean
      required:
      - type
      - title
      - status
      description: Formato RFC 9457 (application/problem+json). Nunca contém restrição alimentar, alérgeno do perfil
        nem dado pessoal (A13, A05).
      additionalProperties: true
    PublicationGateProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          violations:
            type: array
            items:
              type: object
              properties:
                code:
                  type: string
                  enum:
                  - missing_field
                  - source_missing
                  - photo_without_attribution
                  - allergen_state_missing
                  - invariant_verified_without_allergens
                  - invariant_allergen_union
                  - invariant_verified_substitute_without_allergens
                  - invariant_milk_without_lactose
                field:
                  type: string
                message:
                  type: string
              required:
              - code
              - message
              additionalProperties: false
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT de 45 minutos. Carrega só accountId e papel.
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
