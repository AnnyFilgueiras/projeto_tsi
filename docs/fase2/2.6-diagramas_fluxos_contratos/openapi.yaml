openapi: 3.1.0
info:
  title: API Panelada
  version: 1.0.0-2.6
  summary: Contrato da API do Panelada (fonte da verdade, Fase 2.6)
  description: 'Contrato de sessão e contas, sincronização, conjunto baixado, sugestão e busca, rotas de curadoria,
    erros e idempotência. Gerado na conversa 2.6; a revisar pela dupla.


    **Convenções.** JSON em UTF-8. Erros em `application/problem+json` (RFC 9457). Identificadores UUID. Datas em
    ISO 8601.


    **Idempotência.** Operações da fila vão em lote com `opId`. Rotas online que criam recurso exigem `Idempotency-Key`.
    Mesma chave e mesmo conteúdo: resposta gravada. Mesma chave e conteúdo diferente: 422. Validade: 90 dias.


    **Privacidade.** A restrição alimentar nunca trafega em query string, URL, log ou resposta de terceiros. O provedor
    de IA só recebe texto de receita, fonte e ingredientes canônicos.


    **Demo.** HTTP sem TLS em 10.0.2.2 (limitação declarada, ADR-006).'
  license:
    name: Uso acadêmico
    identifier: LicenseRef-Academico
servers:
- url: http://localhost:3000
  description: Demo, acessada pelo Bruno no computador
- url: http://10.0.2.2:3000
  description: Demo, acessada pelo emulador Android
tags:
- name: Sistema
- name: Sessão e contas
- name: Sincronização
- name: Catálogo
- name: Perfil
- name: Sugestão e busca
- name: Rotina
- name: Curadoria
  description: Só papel curador. Usadas pelo Bruno; não há tela.
security:
- bearerAuth: []
paths:
  /v1/saude:
    get:
      tags:
      - Sistema
      operationId: verificarSaude
      summary: Verifica se a API e o banco respondem
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  versao:
                    type: string
                  pacoteAlergenosVersao:
                    type: string
                required:
                - status
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Invalida'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
      security: []
  /v1/contas/anonima:
    post:
      tags:
      - Sessão e contas
      operationId: criarContaAnonima
      summary: Cria conta anônima e devolve os tokens
      description: 'Cria Conta e Usuario na mesma transação (mesma chave primária). Sem dado pessoal. Limitado por
        IP.


        Rastreio: RNF02, A02; ADR-007'
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  contaId:
                    type: string
                    format: uuid
                  tokens:
                    $ref: '#/components/schemas/ParTokens'
                required:
                - contaId
                - tokens
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Invalida'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
      security: []
  /v1/sessoes/entrar:
    post:
      tags:
      - Sessão e contas
      operationId: entrar
      summary: Entra com e-mail e senha
      description: 'Revoga as sessões anteriores da conta (um aparelho ativo, ADR-008).


        Rastreio: ADR-007'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
              - email
              - senha
              additionalProperties: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  contaId:
                    type: string
                    format: uuid
                  tokens:
                    $ref: '#/components/schemas/ParTokens'
                required:
                - contaId
                - tokens
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Invalida'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
      security: []
  /v1/sessoes/renovar:
    post:
      tags:
      - Sessão e contas
      operationId: renovarSessao
      summary: Renova o par de tokens (refresh rotativo)
      description: 'Cada refresh token vale uma vez. Reenvio do mesmo token dentro de 60 s do primeiro uso devolve
        o mesmo par já emitido. Reuso fora da janela revoga a família inteira de tokens (R13, ADR-007).


        Rastreio: ADR-007'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
              additionalProperties: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParTokens'
        '400':
          $ref: '#/components/responses/Invalida'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '401':
          $ref: '#/components/responses/RefreshInvalido'
      security: []
  /v1/sessoes/sair:
    post:
      tags:
      - Sessão e contas
      operationId: sair
      summary: Revoga a sessão atual
      description: 'Rastreio: ADR-007'
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/conta/email:
    put:
      tags:
      - Sessão e contas
      operationId: vincularEmail
      summary: Vincula e-mail e senha à conta anônima
      description: 'Preserva o progresso. Sem recuperação de senha no MVP (ADR-007, item 8).


        Rastreio: ADR-007'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
              - email
              - senha
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '409':
          $ref: '#/components/responses/EmailEmUso'
  /v1/conta:
    delete:
      tags:
      - Sessão e contas
      operationId: excluirConta
      summary: Exclui a conta e todos os dados do usuário
      description: 'Orquestra a exclusão em todos os módulos e remove as operações processadas. A existência de
        US ou RNF de exclusão de conta ainda precisa ser verificada na Fase 1 (Lote 3).


        Rastreio: LGPD; ADR-007 item 9'
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/sincronizacao/operacoes:
    post:
      tags:
      - Sincronização
      operationId: enviarOperacoes
      summary: Envia o lote de operações da fila
      description: 'Cada operação leva o opId gerado no cliente. Reenvio com mesmo opId e mesmo conteúdo devolve
        o resultado gravado com repetida=true. Mesmo opId com conteúdo diferente é recusado por operação com o problema
        `chave-reutilizada`. Máximo de 100 operações por lote. A resposta não falha em bloco: cada operação tem
        seu resultado.


        Rastreio: UC05, UC08, UC10; ADR-008'
      parameters:
      - $ref: '#/components/parameters/PacoteVersao'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operacoes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Operacao'
              required:
              - operacoes
              additionalProperties: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultadoOperacao'
                  pacoteVersaoMinima:
                    type: string
                required:
                - resultados
                - pacoteVersaoMinima
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '413':
          $ref: '#/components/responses/LoteGrande'
  /v1/sincronizacao/conjunto:
    get:
      tags:
      - Sincronização
      operationId: obterConjuntoBaixado
      summary: Obtém o conjunto baixado (texto leve e lista de receitas a baixar)
      description: 'Camada 1: perfil, restrições, preferências, despensa, utensílios, rotina, lista de compras,
        avaliações, conquistas e índice leve do catálogo. Devolve também as receitas das planejadas cuja versão
        local está desatualizada ou ausente. As receitas e as fotos são baixadas à parte. A restrição só é devolvida
        ao próprio dono.


        Rastreio: UC04, UC10, UC11; ADR-001, ADR-008'
      parameters:
      - $ref: '#/components/parameters/PacoteVersao'
      - name: versao
        in: query
        required: false
        schema:
          type: string
        description: Versão do conjunto que o app já tem.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConjuntoBaixado'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '304':
          description: Conjunto sem alterações desde a versão informada
  /v1/receitas/{pratoId}:
    get:
      tags:
      - Catálogo
      operationId: obterReceita
      summary: Obtém a receita completa de um prato aprovado
      description: 'Inclui alérgenos por ingrediente, estado dos alérgenos, substitutos com seus alérgenos e atribuição
        da foto. Não recebe nem devolve restrição do usuário: a classificação roda no aparelho (UC04).


        Rastreio: UC04, UC09; RN15, RN16, RN17, RN22'
      parameters:
      - $ref: '#/components/parameters/PratoId'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receita'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/fotos/{hash}:
    get:
      tags:
      - Catálogo
      operationId: obterFoto
      summary: Baixa uma foto WebP pelo hash do conteúdo
      description: 'Só na demo. No alvo, o app baixa por URL estática do armazenamento de objetos. Conteúdo imutável
        e cacheável.


        Rastreio: ADR-012'
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Imagem WebP
          content:
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
              description: public, max-age=31536000, immutable
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/perfil/despensa:
    put:
      tags:
      - Perfil
      operationId: atualizarDespensa
      summary: Substitui a despensa
      description: 'Edição só online; o app atualiza a cópia local de leitura (ADR-008, detalhamento 2.5).


        Rastreio: UC03; US03'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ingredienteIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - ingredienteIds
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/perfil/utensilios:
    put:
      tags:
      - Perfil
      operationId: atualizarUtensilios
      summary: Substitui os utensílios
      description: 'Rastreio: UC03; US11'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                utensilioIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - utensilioIds
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/perfil/preferencias:
    put:
      tags:
      - Perfil
      operationId: atualizarPreferenciasCulinarias
      summary: Substitui as preferências culinárias
      description: 'Rastreio: UC01; RN10'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                culinariaIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - culinariaIds
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/sugestoes:
    get:
      tags:
      - Sugestão e busca
      operationId: obterSugestoes
      summary: Obtém sugestões alinhadas ao perfil
      description: 'Online. O servidor lê restrições, preferências, despensa e histórico da conta e filtra por alérgenos
        (RN08, RN10). Nunca recebe restrição por query string. Candidatas e prato já concluído não voltam como novidade.


        Rastreio: UC01, UC03; RN08, RN10, RN11; A01, A06'
      parameters:
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      - name: usarDespensa
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sugestoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/SugestaoItem'
                  semResultado:
                    type: boolean
                required:
                - sugestoes
                - semResultado
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/sugestoes/{sugestaoId}/aprovar:
    post:
      tags:
      - Sugestão e busca
      operationId: aprovarSugestao
      summary: Aprova a sugestão e a torna candidata
      description: 'Implementada pelo módulo Rotina e Planejamento, dono do ciclo da sugestão.


        Rastreio: UC02; RN11'
      parameters:
      - $ref: '#/components/parameters/SugestaoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SugestaoItem'
        '409':
          $ref: '#/components/responses/EmAndamento'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/sugestoes/{sugestaoId}/descartar:
    post:
      tags:
      - Sugestão e busca
      operationId: descartarSugestao
      summary: Descarta a sugestão
      description: 'Implementada pelo módulo Rotina e Planejamento.


        Rastreio: UC02; RN11'
      parameters:
      - $ref: '#/components/parameters/SugestaoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sucesso
        '409':
          $ref: '#/components/responses/EmAndamento'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/busca:
    get:
      tags:
      - Sugestão e busca
      operationId: buscarReceitas
      summary: Busca receitas por nome, culinária, ingrediente ou tempo
      description: 'Pratos incompatíveis com a restrição vêm sinalizados, não ocultos (RN08). A sinalização é calculada
        no servidor com a mesma regra do pacote de alérgenos.


        Rastreio: US04; RN08; A06'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: culinariaId
        in: query
        schema:
          type: string
          format: uuid
      - name: ingredienteId
        in: query
        schema:
          type: string
          format: uuid
      - name: tempoMaximoMinutos
        in: query
        schema:
          type: integer
          minimum: 1
      - name: pagina
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: tamanho
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResumoPratoBusca'
                  pagina:
                    type: integer
                  total:
                    type: integer
                required:
                - itens
                - pagina
                - total
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/planos:
    post:
      tags:
      - Rotina
      operationId: criarPlano
      summary: Cria um plano de rotina
      description: 'Online (criar exige rede). O id do plano é gerado no cliente.


        Rastreio: UC05; RN12; R14'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                periodo:
                  type: string
                  enum:
                  - semana
                  - quinzena
                dataInicio:
                  type: string
                  format: date
              required:
              - id
              - periodo
              - dataInicio
              additionalProperties: false
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plano'
        '409':
          $ref: '#/components/responses/EmAndamento'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /v1/planos/{planoId}/itens:
    post:
      tags:
      - Rotina
      operationId: criarItemDeRotina
      summary: Cria item de rotina (prato candidato e data de preparo)
      description: 'Online. O id do item é o opId da operação que o cria; as operações seguintes (reagendar, remover)
        vão pela sincronização com opId próprio.


        Rastreio: UC05; RN12; ADR-008 detalhamento 2.5'
      parameters:
      - $ref: '#/components/parameters/PlanoId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                pratoId:
                  type: string
                  format: uuid
                dataPreparo:
                  type: string
                  format: date
              required:
              - id
              - pratoId
              - dataPreparo
              additionalProperties: false
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDeRotina'
        '409':
          $ref: '#/components/responses/EmAndamento'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /v1/planos/{planoId}/lista-de-compras:
    post:
      tags:
      - Rotina
      operationId: gerarListaDeCompras
      summary: Gera ou regenera a lista de compras do plano
      description: 'Regenerar preserva a marcação dos ingredientes que permanecem (RN14). Plano sem itens retorna
        422.


        Rastreio: UC06; RN14'
      parameters:
      - $ref: '#/components/parameters/PlanoId'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDeCompras'
        '400':
          $ref: '#/components/responses/Invalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraDeNegocio'
  /v1/curadoria/ingredientes:
    post:
      tags:
      - Curadoria
      operationId: cadastrarIngrediente
      summary: Cadastra ingrediente canônico
      description: 'Alérgenos declarados são obrigatórios. Ingrediente com `leite` e sem `lactose` exige semLactose=true.


        Rastreio: UC12 FA1; ADR-010, ADR-014


        Papel exigido: curador.'
      parameters:
