openapi: 3.1.0
info:
  title: API Panelada
  version: 1.1.0-2.7
  summary: Contrato da API do Panelada (fonte da verdade, Fase 2.6)
  description: 'Contrato de sessão e contas, sincronização, conjunto baixado, sugestão e busca, rotas de curadoria,
    erros e idempotência. Gerado na conversa 2.6; v1.1 da 2.7 (identificadores em inglês, ADR-015); a revisar pela
    dupla.


    **Convenções.** JSON em UTF-8. Erros em `application/problem+json` (RFC 9457). Identificadores UUID. Datas em
    ISO 8601.


    **Idempotência.** Operações da fila vão em lote com `opId`. Rotas online que criam recurso exigem `Idempotency-Key`.
    Mesma chave e mesmo conteúdo: resposta gravada. Mesma chave e conteúdo diferente: 422. Validade: 90 dias.


    **Privacidade.** A restrição alimentar nunca trafega em query string, URL, log ou resposta de terceiros. O provedor
    de IA só recebe texto de receita, fonte e ingredientes canônicos.


    **Demo.** HTTP sem TLS em 10.0.2.2 (limitação declarada, ADR-006).'
  license:
    name: Uso acadêmico
    identifier: LicenseRef-Academic
servers:
- url: http://localhost:3000
  description: Demo, acessada pelo Bruno no computador
- url: http://10.0.2.2:3000
  description: Demo, acessada pelo emulador Android
tags:
- name: System
- name: Sessions and accounts
- name: Sync
- name: Catalog
- name: Profile
- name: Suggestion and search
- name: Routine
- name: Curation
  description: Só papel curador. Usadas pelo Bruno; não há tela.
security:
- bearerAuth: []
paths:
  /v1/health:
    get:
      tags:
      - System
      operationId: checkHealth
      summary: Verifica se a API e o banco respondem
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  version:
                    type: string
                  allergenPackageVersion:
                    type: string
                required:
                - status
                additionalProperties: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      security: []
  /v1/accounts/anonymous:
    post:
      tags:
      - Sessions and accounts
      operationId: createAnonymousAccount
      summary: Cria conta anônima e devolve os tokens
      description: 'Cria Conta e Usuario na mesma transação (mesma chave primária). Sem dado pessoal. Limitado por
        IP.


        Rastreio: RNF02, A02; ADR-007'
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    format: uuid
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
                required:
                - accountId
                - tokens
                additionalProperties: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      security: []
  /v1/sessions/sign-in:
    post:
      tags:
      - Sessions and accounts
      operationId: signIn
      summary: Entra com e-mail e senha
      description: 'Revoga as sessões anteriores da conta (um aparelho ativo, ADR-008).


        Rastreio: ADR-007'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
              - email
              - password
              additionalProperties: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    format: uuid
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
                required:
                - accountId
                - tokens
                additionalProperties: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
      security: []
  /v1/sessions/refresh:
    post:
      tags:
      - Sessions and accounts
      operationId: refreshSession
      summary: Renova o par de tokens (refresh rotativo)
      description: 'Cada refresh token vale uma vez. Reenvio do mesmo token dentro de 60 s do primeiro uso devolve
        o mesmo par já emitido. Reuso fora da janela revoga a família inteira de tokens (R13, ADR-007).


        Rastreio: ADR-007'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
              additionalProperties: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '401':
          $ref: '#/components/responses/InvalidRefresh'
      security: []
  /v1/sessions/sign-out:
    post:
      tags:
      - Sessions and accounts
      operationId: signOut
      summary: Revoga a sessão atual
      description: 'Rastreio: ADR-007'
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/account/email:
    put:
      tags:
      - Sessions and accounts
      operationId: linkEmail
      summary: Vincula e-mail e senha à conta anônima
      description: 'Preserva o progresso. Sem recuperação de senha no MVP (ADR-007, item 8).


        Rastreio: ADR-007'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
              required:
              - email
              - password
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '409':
          $ref: '#/components/responses/EmailInUse'
  /v1/account:
    delete:
      tags:
      - Sessions and accounts
      operationId: deleteAccount
      summary: Exclui a conta e todos os dados do usuário
      description: 'Orquestra a exclusão em todos os módulos e remove as operações processadas. A existência de
        US ou RNF de exclusão de conta ainda precisa ser verificada na Fase 1 (Lote 3).


        Rastreio: LGPD; ADR-007 item 9'
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/sync/operations:
    post:
      tags:
      - Sync
      operationId: sendOperations
      summary: Envia o lote de operações da fila
      description: 'Cada operação leva o opId gerado no cliente. Reenvio com mesmo opId e mesmo conteúdo devolve
        o resultado gravado com repetida=true. Mesmo opId com conteúdo diferente é recusado por operação com o problema
        `key-reused`. Máximo de 100 operações por lote. A resposta não falha em bloco: cada operação tem seu resultado.


        Rastreio: UC05, UC08, UC10; ADR-008'
      parameters:
      - $ref: '#/components/parameters/PackageVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Operation'
              required:
              - operations
              additionalProperties: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/OperationResult'
                  minPackageVersion:
                    type: string
                required:
                - results
                - minPackageVersion
                additionalProperties: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '413':
          $ref: '#/components/responses/BatchTooLarge'
  /v1/sync/download-set:
    get:
      tags:
      - Sync
      operationId: getDownloadSet
      summary: Obtém o conjunto baixado (texto leve e lista de receitas a baixar)
      description: 'Camada 1: perfil, restrições, preferências, despensa, utensílios, rotina, lista de compras,
        avaliações, conquistas e índice leve do catálogo. Devolve também as receitas das planejadas cuja versão
        local está desatualizada ou ausente. As receitas e as fotos são baixadas à parte. A restrição só é devolvida
        ao próprio dono.


        Rastreio: UC04, UC10, UC11; ADR-001, ADR-008'
      parameters:
      - $ref: '#/components/parameters/PackageVersion'
      - name: version
        in: query
        required: false
        schema:
          type: string
        description: Versão do conjunto que o app já tem.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadSet'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '304':
          description: Conjunto sem alterações desde a versão informada
  /v1/recipes/{dishId}:
    get:
      tags:
      - Catalog
      operationId: getRecipe
      summary: Obtém a receita completa de um prato aprovado
      description: 'Inclui alérgenos por ingrediente, estado dos alérgenos, substitutos com seus alérgenos e atribuição
        da foto. Não recebe nem devolve restrição do usuário: a classificação roda no aparelho (UC04).


        Rastreio: UC04, UC09; RN15, RN16, RN17, RN22'
      parameters:
      - $ref: '#/components/parameters/DishId'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/photos/{hash}:
    get:
      tags:
      - Catalog
      operationId: getPhoto
      summary: Baixa uma foto WebP pelo hash do conteúdo
      description: 'Só na demo. No alvo, o app baixa por URL estática do armazenamento de objetos. Conteúdo imutável
        e cacheável.


        Rastreio: ADR-012'
      parameters:
      - name: hash
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Imagem WebP
          content:
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
              description: public, max-age=31536000, immutable
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/profile/pantry:
    put:
      tags:
      - Profile
      operationId: updatePantry
      summary: Substitui a despensa
      description: 'Edição só online; o app atualiza a cópia local de leitura (ADR-008, detalhamento 2.5).


        Rastreio: UC03; US03'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ingredientIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - ingredientIds
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/profile/utensils:
    put:
      tags:
      - Profile
      operationId: updateUtensils
      summary: Substitui os utensílios
      description: 'Rastreio: UC03; US11'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                utensilIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - utensilIds
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/profile/preferences:
    put:
      tags:
      - Profile
      operationId: updateCulinaryPreferences
      summary: Substitui as preferências culinárias
      description: 'Rastreio: UC01; RN10'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cuisineIds:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - cuisineIds
              additionalProperties: false
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/suggestions:
    get:
      tags:
      - Suggestion and search
      operationId: getSuggestions
      summary: Obtém sugestões alinhadas ao perfil
      description: 'Online. O servidor lê restrições, preferências, despensa e histórico da conta e filtra por alérgenos
        (RN08, RN10). Nunca recebe restrição por query string. Candidatas e prato já concluído não voltam como novidade.


        Rastreio: UC01, UC03; RN08, RN10, RN11; A01, A06'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      - name: usePantry
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SuggestionItem'
                  noResult:
                    type: boolean
                required:
                - suggestions
                - noResult
                additionalProperties: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/suggestions/{suggestionId}/approve:
    post:
      tags:
      - Suggestion and search
      operationId: approveSuggestion
      summary: Aprova a sugestão e a torna candidata
      description: 'Implementada pelo módulo Rotina e Planejamento, dono do ciclo da sugestão.


        Rastreio: UC02; RN11'
      parameters:
      - $ref: '#/components/parameters/SuggestionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionItem'
        '409':
          $ref: '#/components/responses/InProgress'
        '422':
          $ref: '#/components/responses/BusinessRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/suggestions/{suggestionId}/discard:
    post:
      tags:
      - Suggestion and search
      operationId: discardSuggestion
      summary: Descarta a sugestão
      description: 'Implementada pelo módulo Rotina e Planejamento.


        Rastreio: UC02; RN11'
      parameters:
      - $ref: '#/components/parameters/SuggestionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Sucesso
        '409':
          $ref: '#/components/responses/InProgress'
        '422':
          $ref: '#/components/responses/BusinessRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/search:
    get:
      tags:
      - Suggestion and search
      operationId: searchRecipes
      summary: Busca receitas por nome, culinária, ingrediente ou tempo
      description: 'Pratos incompatíveis com a restrição vêm sinalizados, não ocultos (RN08). A sinalização é calculada
        no servidor com a mesma regra do pacote de alérgenos.


        Rastreio: US04; RN08; A06'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - name: cuisineId
        in: query
        schema:
          type: string
          format: uuid
      - name: ingredientId
        in: query
        schema:
          type: string
          format: uuid
      - name: maxPrepMinutes
        in: query
        schema:
          type: integer
          minimum: 1
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchDishSummary'
                  page:
                    type: integer
                  total:
                    type: integer
                required:
                - items
                - page
                - total
                additionalProperties: false
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/plans:
    post:
      tags:
      - Routine
      operationId: createPlan
      summary: Cria um plano de rotina
      description: 'Online (criar exige rede). O id do plano é gerado no cliente.


        Rastreio: UC05; RN12; R14'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                period:
                  type: string
                  enum:
                  - week
                  - fortnight
                startDate:
                  type: string
                  format: date
              required:
              - id
              - period
              - startDate
              additionalProperties: false
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePlan'
        '409':
          $ref: '#/components/responses/InProgress'
        '422':
          $ref: '#/components/responses/BusinessRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /v1/plans/{planId}/items:
    post:
      tags:
      - Routine
      operationId: createRoutineItem
      summary: Cria item de rotina (prato candidato e data de preparo)
      description: 'Online. O id do item é o opId da operação que o cria; as operações seguintes (reagendar, remover)
        vão pela sincronização com opId próprio.


        Rastreio: UC05; RN12; ADR-008 detalhamento 2.5'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                dishId:
                  type: string
                  format: uuid
                prepDate:
                  type: string
                  format: date
              required:
              - id
              - dishId
              - prepDate
              additionalProperties: false
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineItem'
        '409':
          $ref: '#/components/responses/InProgress'
        '422':
          $ref: '#/components/responses/BusinessRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/plans/{planId}/shopping-list:
    post:
      tags:
      - Routine
      operationId: generateShoppingList
      summary: Gera ou regenera a lista de compras do plano
      description: 'Regenerar preserva a marcação dos ingredientes que permanecem (RN14). Plano sem itens retorna
        422.


        Rastreio: UC06; RN14'
      parameters:
      - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingList'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRule'
  /v1/curation/ingredients:
    post:
      tags:
      - Curation
      operationId: registerIngredient
      summary: Cadastra ingrediente canônico
      description: 'Alérgenos declarados são obrigatórios. Ingrediente com `leite` e sem `lactose` exige lactoseFree=true.


        Rastreio: UC12 FA1; ADR-010, ADR-014


        Papel exigido: curador.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '409':
          $ref: '#/components/responses/InProgress'
        '422':
          $ref: '#/components/responses/BusinessRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
  /v1/curation/utensils:
    post:
      tags:
      - Curation
      operationId: registerUtensil
      summary: Cadastra utensílio
      description: 'Rastreio: UC12 FA1


        Papel exigido: curador.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
