          type: boolean
          description: true quando o opId já havia sido processado; nada foi reaplicado.
        desbloqueios:
          $ref: '#/components/schemas/Desbloqueios'
        erro:
          $ref: '#/components/schemas/Problema'
      required:
      - opId
      - status
      - repetida
      description: 'Erro de rede ou 5xx não gera resultado: o app reenvia o mesmo opId.'
      additionalProperties: false
    ItemDeRotina:
      type: object
