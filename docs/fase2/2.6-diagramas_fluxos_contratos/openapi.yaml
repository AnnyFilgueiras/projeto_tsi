          description: Alérgenos da receita batem com a união dos ingredientes.
        lactoseFreeChecked:
          type: boolean
          description: Obrigatório true quando algum ingrediente leva lactoseFree.
        confirmedAllergenFree:
          type: boolean
          description: 'Obrigatório true quando a lista de alérgenos da receita é vazia: o curador afirma que conferiu
