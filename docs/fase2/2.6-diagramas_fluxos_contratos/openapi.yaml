        consentimentoEm:
          type: string
          format: date-time
      required:
      - tipoRestricao
      - consentimentoEm
      additionalProperties: false
    CargaRevogarRestricao:
      type: object
      properties:
        tipoRestricao:
          type: string
      required:
      - tipoRestricao
      additionalProperties: false
    CargaLembretes:
      type: object
