                type: string
                format: date-time
            required:
            - tipoRestricao
            - consentimentoEm
            additionalProperties: false
        despensa:
          type: array
          items:
            type: string
            format: uuid
        utensilios:
          type: array
          items:
            type: string
            format: uuid
        planos:
          type: array
          items:
            $ref: '#/components/schemas/Plano'
        avaliacoes:
          type: array
          items:
            $ref: '#/components/schemas/Avaliacao'
        conquistas:
