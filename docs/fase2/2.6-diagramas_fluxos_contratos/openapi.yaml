      description: Qualquer subconjunto dos campos da proposta. Alterar alérgenos rebaixa o estado `verified`.
      additionalProperties: false
    VerificationChecklist:
      type: object
      properties:
        checkedIngredients:
          type: boolean
          const: true
          description: Cada ingrediente conferido contra os 19 códigos, incluindo derivados.
        secondSourceChecked:
          type: boolean
          description: Recomendada, não obrigatória.
        secondSourceDescription:
          type: string
          maxLength: 300
        unionChecked:
          type: boolean
